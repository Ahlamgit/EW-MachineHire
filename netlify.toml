# OPTIONAL — Netlify Free staging only.
# Isolated docs: deploy/netlify/README.md
# Portable Node path (any host): npm run build && npm run start — see docs/PORTABLE_HOSTING.md
#
# OpenNext is applied automatically by Netlify for Next.js 13.5+.
# Do NOT add [[plugins]] package = "@netlify/plugin-nextjs" unless debugging a
# specific adapter version — pinning opts out of automatic OpenNext updates.
# Do NOT add OpenNext / Netlify adapter packages to package.json for normal staging.
#
# Deleting this file does not break local or Hostinger-style Node deploys.
# Stay on Netlify Free (hard credit limit, no auto-recharge). Prefer Deploy
# Previews / branch deploys over frequent production publishes (15 credits each).
# Path A: *.netlify.app (zero DNS). See docs/STAGING_DEPLOY.md.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Next.js framework detection + OpenNext handle SSR, middleware (Edge),
# route handlers, and Server Actions. No static `out/` export.
